<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Sport - Coaching & Fit</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Mon Sport</h1>
            <div id="streak-counter" class="streak-badge">🔥 Série : <span id="streak-count">0</span> jours</div>
        </header>

        <main>
            <!-- Écran de sélection/début -->
            <section id="setup-card" class="card">
                <h2>Séance du jour</h2>
                <p id="workout-desc">Chargement du programme...</p>
                <button id="start-btn" class="btn primary-btn">Démarrer l'entraînement</button>
            </section>

            <!-- Écran d'exercice actif -->
            <section id="exercise-card" class="card hidden">
                <div class="exercise-header">
                    <span id="exercise-step">Exercice 1/5</span>
                    <h2 id="exercise-name">Squats</h2>
                </div>

                <!-- Visuel d'illustration de l'exercice -->
                <div class="media-container">
                    <img id="exercise-image" src="mon-sport/default.jpg" alt="Illustration de l'exercice" loading="lazy">
                </div>

                <div class="timer-display">
                    <span id="timer-seconds">45</span><span class="unit">s</span>
                </div>

                <div class="controls">
                    <button id="pause-btn" class="btn secondary-btn">Pause</button>
                    <button id="skip-btn" class="btn tertiary-btn">Suivant</button>
                </div>
            </section>

            <!-- Écran de récupération / Hydratation -->
            <section id="rest-card" class="card hidden">
                <h2>Temps de repos</h2>
                <div class="timer-display rest">
                    <span id="rest-seconds">30</span><span class="unit">s</span>
                </div>
                <div class="hydration-reminder">
                    💧 <strong>Hydratation :</strong> Buvez une gorgée d'eau !
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>

</html>
